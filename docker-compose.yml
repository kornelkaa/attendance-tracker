services:
  attendance-tracker:
    build: .
    container_name: attendance-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Az SQLite adatbázis megőrzése a gépen a konténer újraindítása után is
      - ./instance:/app/instance
    env_file:
      - path: .env
        required: false
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - PORT=${PORT:-5000}

